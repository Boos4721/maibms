name: iOS BLE regression checks

on:
  push:
    branches:
      - 'fix/ios-ble-write-mode'
  pull_request:
    paths:
      - 'composeApp/src/iosMain/**'
      - 'composeApp/src/commonMain/**'
      - 'composeApp/src/desktopTest/**'
      - '.github/workflows/ios-ble-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and iOS compilation
        run: >-
          ./gradlew --no-daemon :composeApp:desktopTest
          :composeApp:compileKotlinIosArm64
          :composeApp:compileKotlinIosSimulatorArm64

  ipa:
    name: Build unsigned IPA
    if: github.repository == 'Boos4721/maibms' && github.event_name != 'pull_request'
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-ipa-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build IPA
        id: build
        uses: ./.github/actions/build-unsigned-ipa
        with:
          asset_name: maibms-ios-ble-fix-unsigned.ipa
          configuration: Release
      - uses: actions/upload-artifact@v4
        with:
          name: maibms-ios-ble-fix-ipa
          path: ${{ steps.build.outputs.ipa }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
